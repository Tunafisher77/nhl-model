name: Daily NHL Picks

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional YYYY-MM-DD date
        required: false
        type: string
      dry_run:
        description: Generate without writing Google Sheets
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '5,35 13 * * *'
    - cron: '5 14 * * *'

permissions:
  contents: read

concurrency:
  group: daily-nhl-${{ github.event.inputs.target_date || 'today' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Generate and publish NHL picks
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NHL_SPREADSHEET_ID: ${{ secrets.NHL_SPREADSHEET_ID }}
          NHL_TARGET_DATE: ${{ github.event.inputs.target_date }}
          NHL_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          NHL_ALLOW_PRESTART: ${{ vars.NHL_ALLOW_PRESTART }}
        run: python run_daily_nhl.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-output-${{ github.run_id }}
          path: nhl_output.json
          if-no-files-found: ignore
          retention-days: 14
