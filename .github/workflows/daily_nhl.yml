name: Daily NHL Picks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_nhl.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional YYYY-MM-DD date
        required: false
        type: string
      dry_run:
        description: Generate without writing Google Sheets
        required: false
        default: false
        type: boolean
  schedule:
    # Generate well before the 6 AM Pacific mailer. Multiple early backups absorb
    # GitHub schedule delays; the Apps Script sent markers prevent duplicate mail.
    - cron: '30 9 * * *'
    # One early generation plus one morning recovery; avoid hourly republishing.
    - cron: '15 13 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-nhl-${{ github.event.inputs.target_date || 'today' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/457900160143/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: mlb-hr-model@mlb-hr-model-498322.iam.gserviceaccount.com
      - name: Generate and publish NHL picks
        env:
          NHL_SPREADSHEET_ID: ${{ secrets.NHL_SPREADSHEET_ID }}
          NHL_TARGET_DATE: ${{ github.event.inputs.target_date }}
          NHL_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          NHL_ALLOW_PRESTART: ${{ vars.NHL_ALLOW_PRESTART }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "NHL generation attempt ${attempt}/3"
            if python run_daily_nhl.py; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "::error::NHL generation failed after 3 attempts."
          exit 1
      - name: Verify published NHL email summaries
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NHL_SPREADSHEET_ID: ${{ secrets.NHL_SPREADSHEET_ID }}
          NHL_TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import google.auth
          import gspread

          expected = os.environ.get("NHL_TARGET_DATE") or datetime.now(
              ZoneInfo("America/Los_Angeles")
          ).date().isoformat()
          credentials, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/spreadsheets"]
          )
          book = gspread.authorize(credentials).open_by_key(os.environ["NHL_SPREADSHEET_ID"])
          tabs = (
              "NHL Game Email Summary",
              "NHL Goal Scorer Email Summary",
              "NHL Best Card Email Summary",
          )
          for tab in tabs:
              values = book.worksheet(tab).get("A1:A2")
              actual = values[1][0].strip() if len(values) > 1 and values[1] else ""
              print(f"{tab}: published={actual}, expected={expected}")
              if actual != expected:
                  raise SystemExit(f"::error::{tab} not ready for email delivery")
          print("All three NHL email summaries are ready for the mailer.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-output-${{ github.run_id }}
          path: nhl_output.json
          if-no-files-found: ignore
          retention-days: 14
